apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - homepage.yaml
  - deployment.yaml

configMapGenerator:
  - name: homepage-background
    namespace: homepage
    files:
      - background.jpg=https://raw.githubusercontent.com/QianDiLin/homelab-yaml/main/apps/homepage/images/background.jpg

generatorOptions:
  disableNameSuffixHash: true