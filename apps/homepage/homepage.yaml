apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage

data:
  settings.yaml: |
    title: Qian's Homelab
    theme: dark
    color: slate
    headerStyle: boxed
    useEqualHeights: true

    background:
      image: https://raw.githubusercontent.com/QianDiLin/homelab-yaml/main/apps/homepage/images/background.jpg
      blur: md
      saturate: 70
      brightness: 45
      opacity: 65

    layout:
      Status:
        style: column
        columns: 1
        header: false
      Infrastructure:
        style: column
        columns: 2
        header: false
      Apps:
        style: column
        columns: 2
        header: false
      Network:
        style: column
        columns: 2
        header: false
      Monitoring:
        style: column
        columns: 2
        header: false

  services.yaml: |
    - Status: 
        - Internet Speed:
            icon: mdi-speedometer
            widget:
                type: customapi
                url: http://n8n.home.arpa/webhook/speedtest-latest
                refreshInterval: 300000
                mappings:
                - field: download
                  label: Download
                  format: text
                - field: upload
                  label: Upload
                  format: text
                - field: ping
                  label: Ping
                  format: text
                - field: last_run
                  label: Last Run
                  format: text
    
        - Pi-hole:
            href: http://192.168.1.10
            description: Network DNS ad-blocking
            icon: pi-hole.png
            widget:
              type: pihole
              url: http://192.168.1.10
              version: 6
              key: "{{HOMEPAGE_VAR_PIHOLE_KEY}}"
              fields: ["queries", "blocked", "blocked_percent", "gravity"]

        - Uptime Kuma:
            href: http://uptime.home.arpa/status/home
            description: Homelab service uptime
            icon: uptime-kuma.png
            widget:
              type: uptimekuma
              url: http://uptime-kuma.uptime-kuma.svc.cluster.local:3001
              slug: home
              fields: ["up", "down", "uptime", "incident"]
        
    
    - Infrastructure:
        - Kubernetes:
            href: https://github.com/QianDiLin/homelab-yaml
            description: Talos Kubernetes cluster
            icon: kubernetes.png

        - Traefik:
            href: http://localhost:8080/dashboard/#/
            description: Dashboard via local port-forward
            icon: traefik.png

        - Longhorn:
            href: http://longhorn.home.arpa
            description: Kubernetes persistent storage
            icon: longhorn.png

        - Proxmox:
            href: https://192.168.1.158:8006
            description: Virtualization host
            icon: proxmox.png

    - Apps:
        - Homepage:
            href: http://homepage.home.arpa
            description: Homelab dashboard
            icon: homepage.png

        - Home Assistant:
            href: http://homeassistant.home.arpa
            description: Smart home dashboard
            icon: home-assistant.png

        - Vaultwarden:
            href: https://vaultwarden.home.arpa
            description: Password manager
            icon: vaultwarden.png

        - n8n:
            href: http://n8n.home.arpa
            description: Workflow automation and homelab API webhooks
            icon: n8n.png

    - Network:
        - OPNsense:
            href: https://192.168.1.1
            description: Firewall, router, VLANs, and DHCP
            icon: opnsense.png

        - Tailscale:
            href: https://login.tailscale.com/admin/machines
            description: Private mesh VPN and remote access
            icon: tailscale.png

        - MetalLB:
            href: http://192.168.1.240
            description: Kubernetes LoadBalancer IP service
            icon: kubernetes.png

        - TrueNAS:
            href: http://192.168.1.143/ui/signin
            description: NAS storage, shares, and backups
            icon: truenas.png

  bookmarks.yaml: |
    - Homelab:
        - Proxmox:
            - href: http://proxmox.home.arpa

        - OPNsense:
            - href: https://192.168.1.1

        - Pi-hole:
            - href: http://pi.hole/admin

        - TrueNAS:
            - href: http://192.168.1.143/ui/signin

        - Tailscale:
            - href: https://login.tailscale.com/admin/machines

        - n8n:
            - href: http://n8n.home.arpa

    - Learning:
        - Kubernetes Docs:
            - href: https://kubernetes.io/docs/

        - Talos Docs:
            - href: https://www.talos.dev/

        - Longhorn Docs:
            - href: https://longhorn.io/docs/

  widgets.yaml: |
    - search:
        provider: google
        target: _blank

    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  docker.yaml: |
    {}

  kubernetes.yaml: |
    mode: disabled